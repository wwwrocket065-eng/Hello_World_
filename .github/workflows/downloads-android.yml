name: Downloads Android
on:
  push:
    branches: [downloads-android]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: |
          test -f "$ANDROID_HOME/platforms/android-35/android.jar" || sdkmanager 'platforms;android-35'
          test -d "$ANDROID_HOME/build-tools/35.0.0" || sdkmanager 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: gradle --no-daemon --stacktrace :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Downloads-1.0.2-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
