name: Konsilium Android 0.5
on:
  push:
    branches: [konsilium-android-0.5]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        run: |
          SDK="$ANDROID_HOME"
          test -f "$SDK/platforms/android-35/android.jar" || sdkmanager 'platforms;android-35'
          test -d "$SDK/build-tools/35.0.0" || sdkmanager 'build-tools;35.0.0'
      - name: Package official llama.cpp ARM64 release
        run: |
          set -euxo pipefail
          curl -fL --retry 3 https://github.com/ggml-org/llama.cpp/releases/download/b12785/llama-b12785-bin-android-arm64.tar.gz -o /tmp/llama.tgz
          mkdir /tmp/llama
          tar -xzf /tmp/llama.tgz -C /tmp/llama
          server="$(find /tmp/llama -type f -name llama-server | head -1)"
          test -n "$server"
          dest=app/src/main/jniLibs/arm64-v8a
          mkdir -p "$dest"
          cp "$server" "$dest/libllamaserver.so"
          find "$(dirname "$server")" -maxdepth 1 -name 'lib*.so' -exec cp -L {} "$dest/" \;
          find "$(dirname "$server")" -maxdepth 1 -name 'lib*.so.*' -print
          readelf -d "$dest/libllamaserver.so"
          for f in "$dest"/*.so; do
            echo "checking $f"
            readelf -d "$f" | sed -n 's/.*Shared library: \[\(.*\)\]/\1/p'
          done
          mkdir -p app/src/main/assets
          find /tmp/llama -name LICENSE -exec cp {} app/src/main/assets/llama-LICENSE.txt \;
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: gradle --no-daemon :app:assembleDebug
      - run: |
          cp app/build/outputs/apk/debug/app-debug.apk Konsilium-0.5.0.apk
          unzip -l Konsilium-0.5.0.apk | grep -E 'libllamaserver.so|assets/index.html'
      - uses: actions/upload-artifact@v4
        with:
          name: Konsilium-0.5.0-APK
          path: Konsilium-0.5.0.apk
