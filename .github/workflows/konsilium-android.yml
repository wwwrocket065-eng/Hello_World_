name: Konsilium Android 0.8
on:
  push:
    branches: [konsilium-android-0.8]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        run: |
          test -f "$ANDROID_HOME/platforms/android-35/android.jar" || sdkmanager 'platforms;android-35'
          test -d "$ANDROID_HOME/build-tools/35.0.0" || sdkmanager 'build-tools;35.0.0'
      - name: Prepare official llama.cpp ARM64 release
        run: |
          set -euxo pipefail
          curl -fL --retry 3 https://github.com/ggml-org/llama.cpp/releases/download/b12785/llama-b12785-bin-android-arm64.tar.gz -o /tmp/llama.tgz
          mkdir /tmp/llama
          tar -xzf /tmp/llama.tgz -C /tmp/llama
          server="$(find /tmp/llama -type f -name llama-server | head -1)"
          test -n "$server"
          dest=/tmp/native-apk/lib/arm64-v8a
          mkdir -p "$dest"
          cp "$server" "$dest/libllamaserver.so"
          find "$(dirname "$server")" -maxdepth 1 -name 'lib*.so' -exec cp -L {} "$dest/" \;
          rm -f "$dest"/libllama-{batched-bench,bench,cli,completion,fit-params,perplexity,quantize}-impl.so
          readelf -h "$dest/libllamaserver.so"
          for f in "$dest"/*.so; do
            while read -r needed; do
              case "$needed" in libc.so|libm.so|libdl.so|liblog.so|libandroid.so|libz.so) ;; *) test -f "$dest/$needed" ;; esac
            done < <(readelf -d "$f" | sed -n 's/.*Shared library: \[\(.*\)\]/\1/p')
          done
          mkdir -p app/src/main/assets
          find /tmp/llama -name LICENSE -exec cp {} app/src/main/assets/llama-LICENSE.txt \;
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Check bundled UI JavaScript
        run: |
          python3 -c "import re; from pathlib import Path; Path('/tmp/ui.js').write_text(re.search(r'<script>(.*?)</script>',Path('app/src/main/assets/index.html').read_text(),re.S).group(1))"
          node --check /tmp/ui.js
      - run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Add native payload and sign APK
        run: |
          set -euxo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/unsigned.apk
          zip -d /tmp/unsigned.apk 'META-INF/*.RSA' 'META-INF/*.SF' 'META-INF/MANIFEST.MF' || true
          (cd /tmp/native-apk && zip -q -6 -r /tmp/unsigned.apk lib)
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/zipalign" -f 4 /tmp/unsigned.apk /tmp/aligned.apk
          keytool -genkeypair -noprompt -keystore /tmp/konsilium-debug.jks -storepass android -keypass android -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          "$BT/apksigner" sign --ks /tmp/konsilium-debug.jks --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebugkey --out Konsilium-0.8.4-ci.apk /tmp/aligned.apk
          "$BT/apksigner" verify --verbose Konsilium-0.8.4-ci.apk
          "$BT/aapt" dump xmltree Konsilium-0.8.4-ci.apk AndroidManifest.xml | grep extractNativeLibs
          unzip -l Konsilium-0.8.4-ci.apk | grep -E 'libllamaserver.so|assets/index.html'
          ls -lh Konsilium-0.8.4-ci.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Konsilium-0.8.4-CI-APK
          path: Konsilium-0.8.4-ci.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-signing-tools
          path: /usr/local/lib/android/sdk/build-tools/35.0.0/lib/apksigner.jar
