name: Konsilium Android 0.4
on:
  push:
    branches: [konsilium-android-0.4]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          if [ ! -f "$SDK/platforms/android-35/android.jar" ] || [ ! -d "$SDK/build-tools/35.0.0" ]; then
            SM="$(find "$SDK/cmdline-tools" -path '*/bin/sdkmanager' | sort -V | tail -1)"
            test -x "$SM"
            "$SM" --sdk_root="$SDK" 'platforms;android-35' 'build-tools;35.0.0'
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: gradle --no-daemon :app:assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk Konsilium-0.4.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Konsilium-0.4.0-APK
          path: Konsilium-0.4.0.apk
