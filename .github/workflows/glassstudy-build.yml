name: GlassStudy Android Build
on:
  push:
    branches: [glassstudy-filament-ci]
    paths:
      - 'glassstudy/**'
      - '.github/workflows/glassstudy-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Verify installed Android platform
        run: |
          test -f "$ANDROID_HOME/platforms/android-35/android.jar" || "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Generate the 66 GLB model assets
        run: python3 glassstudy/tools/make_models.py
      - name: Fetch the Filament studio IBL
        run: |
          mkdir -p glassstudy/app/src/main/assets/envs
          curl --fail --location --retry 3 --max-time 60 \
            https://raw.githubusercontent.com/margelo/react-native-filament/main/package/assets/RNF_default_env_ibl.ktx \
            -o glassstudy/app/src/main/assets/envs/studio_ibl.ktx
          python3 - <<'PY'
          from pathlib import Path
          f=Path('glassstudy/app/src/main/assets/envs/studio_ibl.ktx')
          assert f.stat().st_size>2_000_000, 'IBL incomplete'
          assert f.read_bytes().startswith(bytes.fromhex('ab4b5458203131bb0d0a1a0a')),'Invalid KTX'
          PY
      - name: Verify source / camera / updater / assets
        run: python3 glassstudy/tools/test_project.py
      - name: Build unsigned APK for original-key signing
        working-directory: glassstudy
        run: gradle --no-daemon :app:assembleCiUnsigned --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: GlassStudy-v0.2.15-CI-unsigned-SIGN-BEFORE-INSTALL
          path: glassstudy/app/build/outputs/apk/ciUnsigned/*.apk