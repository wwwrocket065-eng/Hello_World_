name: Numera Android APK

on:
  push:
    branches: [numberfactory-android]
    paths:
      - "numberfactory/**"
      - ".github/workflows/numera-android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build Numera debug APK
        working-directory: numberfactory
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: numera-v0.1.0-debug-apk
          path: numberfactory/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish preview release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: numera-v0.1.0-preview
          name: Numera 0.1.0 Android preview
          target_commitish: numberfactory-android
          prerelease: true
          files: numberfactory/app/build/outputs/apk/debug/app-debug.apk
          body: "Independent Android prototype: animated number factory, conveyors, arithmetic, touch placement and a new dark graphical style. Debug signed for testing."
