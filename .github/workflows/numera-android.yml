name: Numera Android APK

on:
  push:
    branches: [numera-ui-fixes-20261031]
    paths:
      - "numberfactory/**"
      - ".github/workflows/numera-android.yml"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "numberfactory/**"
      - ".github/workflows/numera-android.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Verify preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Verify all multi-cell footprints and ports
        run: |
          mkdir -p "$RUNNER_TEMP/numera-tests"
          javac -d "$RUNNER_TEMP/numera-tests" \
            numberfactory/app/src/main/java/com/numera/factory/MachineLayout.java \
            numberfactory/tests/com/numera/factory/MachineLayoutTest.java
          java -cp "$RUNNER_TEMP/numera-tests" com.numera.factory.MachineLayoutTest
      - name: Build Numera debug APK
        working-directory: numberfactory
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: numera-development-check-apk
          path: numberfactory/app/build/outputs/apk/debug/app-debug.apk
      # Development pushes run CI but do not publish intermediate APK releases.
      # Enable publishing only after the full game feature and device QA gates pass.
