name: Arknights Android APK
on:
  workflow_dispatch:
  push:
    branches: [arknights-recruitment-starter]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: arknights
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - uses: android-actions/setup-android@v4
      - name: Install SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Test recruitment algorithm
        run: |
          mkdir -p build/smoke
          javac -d build/smoke app/src/main/java/com/example/arkrecruit/RecruitmentEngine.java app/src/main/java/com/example/arkrecruit/OperatorTagMapper.java app/src/main/java/com/example/arkrecruit/TargetListFilter.java tests/EngineSmoke.java
          java -cp build/smoke com.example.arkrecruit.EngineSmoke
      - name: Test button geometry and partial OCR rejection
        run: |
          mkdir -p build/geometry
          javac -d build/geometry tests/graphics/android/graphics/*.java app/src/main/java/com/example/arkrecruit/TagBoundsDetector.java app/src/main/java/com/example/arkrecruit/TagGrid.java app/src/main/java/com/example/arkrecruit/TagContrastNormalizer.java app/src/main/java/com/example/arkrecruit/RecruitmentScreenProbe.java app/src/main/java/com/example/arkrecruit/TagOcrInput.java app/src/main/java/com/example/arkrecruit/RecruitmentClock.java tests/graphics/TagGeometrySmoke.java
          java -cp build/geometry com.example.arkrecruit.TagGeometrySmoke
      - name: Validate external Global API
        continue-on-error: true
        run: python3 tools/check_data.py
      - name: Bundle offline operator portraits
        run: |
          python3 -m pip install 'Pillow>=11,<13'
          python3 tools/prepare_china.py
          python3 tools/prepare_portraits.py
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: arknights-debug-apk
          path: arknights/app/build/outputs/apk/debug/*.apk

