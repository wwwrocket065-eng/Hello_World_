name: GlassStudy Filament Android
on:
  push:
    branches: [glassstudy-filament-ci]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify bundled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-35" || "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Download studio IBL environment
        run: |
          mkdir -p glassstudy/app/src/main/assets
          curl -fL --retry 2 --max-time 45 "https://raw.githubusercontent.com/margelo/react-native-filament/main/package/assets/RNF_default_env_ibl.ktx" -o glassstudy/app/src/main/assets/studio_ibl.ktx
          python3 -c 'from pathlib import Path; p=Path("glassstudy/app/src/main/assets/studio_ibl.ktx"); assert p.stat().st_size>10000 and p.read_bytes().startswith(bytes.fromhex("ab4b5458203131bb0d0a1a0a")), "Invalid KTX1 IBL";print("Verified studio IBL bytes",p.stat().st_size)'
      - name: Generate shared GLB models
        run: python3 glassstudy/tools/make_models.py
      - name: Build native Android APK
        working-directory: glassstudy
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: GlassStudy-Filament-0.2.06-UnsignedForResign
          path: glassstudy/app/build/outputs/apk/debug/*.apk

      - name: Provide official Android APK signing verifier
        if: always()
        run: |
          SDK="$ANDROID_HOME/build-tools/35.0.0"
          mkdir -p signingtools
          cp "$SDK/lib/apksigner.jar" signingtools/apksigner.jar
          cp "$SDK/zipalign" signingtools/zipalign
          echo "Official apksigner and zipalign staged"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Official-Android-Signing-Tools
          path: signingtools/
