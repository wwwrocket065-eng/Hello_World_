name: Build Developer Journal Android APK
on:
  push:
    branches:
      - journal-developer-android
    paths:
      - developer-journal/**
      - .github/workflows/build-developer-journal.yml
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        run: |
          cd developer-journal
          gradle :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: JournalDeveloper-Android-APK
          path: developer-journal/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
