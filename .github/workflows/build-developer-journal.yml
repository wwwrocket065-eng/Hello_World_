name: Build Developer Journal Android (unsigned — private signing required)
on:
  push:
    branches:
      - journal-developer-android
    paths:
      - developer-journal/**
      - .github/workflows/build-developer-journal.yml
  workflow_dispatch:
jobs:
  unsigned:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Check protected journal UI
        run: python3 developer-journal/tools/check_contract.py
      - name: Build unsigned APK (NOT installable)
        run: |
          cd developer-journal
          gradle :app:assembleRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: JournalDeveloper-UNSIGNED-APK-PRIVATE-SIGNING-REQUIRED
          path: developer-journal/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
