plugins {
    id 'com.android.application'
}
android {
    namespace 'com.numera.factory'
    compileSdk 35
    defaultConfig {
        applicationId 'com.numera.factory'
        minSdk 26
        targetSdk 35
        versionCode 11
        versionName '0.5.2'
    }
    // Debug previews use their own app ID: never replace a user's existing
    // Numera install with a differently signed ephemeral CI debug certificate.
    buildTypes {
        debug {
            applicationIdSuffix '.qa6'
            versionNameSuffix '-test'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
