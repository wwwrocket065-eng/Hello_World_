plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.glassstudy.filament'
    compileSdk 35
    defaultConfig {
        // SAME app ID as the installed working v0.2.09. No data loss on upgrade.
        applicationId 'com.glassstudy.filament.stable'
        minSdk 26
        targetSdk 35
        versionCode Integer.parseInt(project.property('GLASSSTUDY_VERSION_CODE').toString())
        versionName project.property('GLASSSTUDY_VERSION').toString()
        buildConfigField 'String', 'UPDATE_BASE_URL', '"https://raw.githubusercontent.com/wwwrocket065-eng/Hello_World_/glassstudy-filament-ci/glassstudy/updates/v2"'
        ndk { abiFilters 'arm64-v8a' }
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    signingConfigs {
        release {
            def keyFile = System.getenv('GLASSSTUDY_KEYSTORE')
            if (keyFile) {
                storeFile file(keyFile)
                storePassword System.getenv('GLASSSTUDY_STORE_PASSWORD')
                keyAlias 'glassstudy'
                keyPassword System.getenv('GLASSSTUDY_STORE_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        ciUnsigned {
            initWith release
            matchingFallbacks = ['release']
            signingConfig null
        }
        release {
            minifyEnabled false
            // Fail release builds without the ORIGINAL certificate; never sign a replacement identity.
            if (System.getenv('GLASSSTUDY_KEYSTORE') && System.getenv('GLASSSTUDY_STORE_PASSWORD')) {
                signingConfig signingConfigs.release
            }
        }
    }
    packaging { resources { excludes += '/META-INF/{AL2.0,LGPL2.1}' } }
}

dependencies {
    implementation 'com.google.android.filament:filament-android:1.77.3'
    implementation 'com.google.android.filament:gltfio-android:1.77.3'
    implementation 'com.google.android.filament:filament-utils-android:1.77.3'
    implementation 'androidx.core:core:1.15.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
}

// Stop release distribution unless the original APK key was configured.
tasks.register('checkReleaseSigning') {
    doLast {
        if (!System.getenv('GLASSSTUDY_KEYSTORE') || !System.getenv('GLASSSTUDY_STORE_PASSWORD')) {
            throw new GradleException('GLASSSTUDY_KEYSTORE and GLASSSTUDY_STORE_PASSWORD required for release')
        }
    }
}
tasks.matching { it.name == 'assembleRelease' }.configureEach { dependsOn 'checkReleaseSigning' }