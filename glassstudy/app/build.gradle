plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
android {
 namespace 'com.glassstudy.filament'
 compileSdk 35
 defaultConfig { applicationId 'com.glassstudy.filament.preview'; minSdk 26; targetSdk 35; versionCode 20001; versionName '0.2.01-filament-ci'; ndk { abiFilters 'arm64-v8a' } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 kotlinOptions { jvmTarget = '17' }
}
dependencies {
 implementation 'com.google.android.filament:filament-android:1.77.3'
 implementation 'com.google.android.filament:gltfio-android:1.77.3'
 implementation 'com.google.android.filament:filament-utils-android:1.77.3'
 implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
}
